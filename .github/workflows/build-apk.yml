name: Build Android APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build release APK
        working-directory: android
        run: bash ./gradlew :app:assembleRelease --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: yanban-android-v0.1.15
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
