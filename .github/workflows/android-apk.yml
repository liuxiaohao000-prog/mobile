name: Android APK
on:
  push:
    branches:
      - main
      - 'v2/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify stable release notes
        run: |
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('app.json','utf8')).expo.version;const docs=fs.readFileSync('docs/v2-preview.md','utf8');const readme=fs.readFileSync('README.md','utf8');if(!docs.includes('## V'+v+'：')||!readme.includes('V'+v)){throw new Error('Missing README release notes for V'+v)}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-24.04 runners already provide Android SDK cmdline-tools;
      # setup-android@v3 currently tries the removed SDK package 'tools'.
      - name: Install Android SDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --channel=3 --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.1.12297006"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Build signed stable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace -Pandroid.compileSdkVersion=37 -Pandroid.targetSdkVersion=36 -Pandroid.buildToolsVersion=36.0.0
      - name: Copy APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/jinri-suifang-v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jinri-suifang-v1.0.0-apk
          path: dist/jinri-suifang-v1.0.0.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub stable APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/v2/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Stable release $TAG already exists; keeping the published artifact unchanged."
            exit 0
          fi
          gh release create "$TAG" dist/jinri-suifang-v1.0.0.apk \
            --target "${GITHUB_SHA}" \
            --title "今日随访 V1.0.0 正式版" \
            --notes "正式版 1.0.0 基于已验收的 2.0.18-preview，仅重新定稿版本与发布方式，无功能改动。保留原包名、原签名、数据库和加密备份。为保护患者数据，请先备份，再直接覆盖安装，不要卸载旧版。详细版本记录见 README.md、docs/v2-preview.md。项目当前 release 签名仍沿用原 debug.keystore，尚非应用商店专用签名。"
